        /* ANMOL CHILDRENWEAR — title animations (Theme picker > Anmol Animation) */
        @keyframes shineSweep {
          0% { background-position: -200% center; }
          100% { background-position: 200% center; }
        }
        @keyframes glowPulse {
          0%, 100% { filter: drop-shadow(0 0 6px rgba(255,255,255,0.55)) drop-shadow(0 0 18px rgba(255,235,180,0.45)); }

        }

        }

          background-clip: text;
